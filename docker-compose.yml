version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beecarbonat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-beecarbonat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beecarbonat_secure_pwd}
      POSTGRES_DB: ${DB_NAME:-beecarbonat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-beecarbonat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beecarbonat-net

  redis:
    image: redis:7-alpine
    container_name: beecarbonat-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pwd}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pwd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beecarbonat-net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: beecarbonat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-beecarbonat}:${DB_PASSWORD:-beecarbonat_secure_pwd}@postgres:5432/${DB_NAME:-beecarbonat}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pwd}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SENTRY_DSN=${SENTRY_DSN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "5000:5000"
    networks:
      - beecarbonat-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: beecarbonat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - beecarbonat-net

  nginx:
    image: nginx:alpine
    container_name: beecarbonat-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - beecarbonat-net

  certbot:
    image: certbot/certbot
    container_name: beecarbonat-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait; done'"

  pg-backup:
    image: postgres:16-alpine
    container_name: beecarbonat-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${DB_USER:-beecarbonat}
      PGPASSWORD: ${DB_PASSWORD:-beecarbonat_secure_pwd}
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-beecarbonat}
    volumes:
      - pg_backups:/backups
    entrypoint: >
      /bin/sh -c 'echo "0 0 * * * pg_dump -F c -f /backups/db_backup_$$(date +\%Y\%m\%d).dump" > /etc/crontabs/root && crond -f'
    networks:
      - beecarbonat-net

  prometheus:
    image: prom/prometheus:latest
    container_name: beecarbonat-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - beecarbonat-net

  grafana:
    image: grafana/grafana:latest
    container_name: beecarbonat-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - beecarbonat-net

volumes:
  postgres_data:
  redis_data:
  pg_backups:
  prometheus_data:
  grafana_data:

networks:
  beecarbonat-net:
    driver: bridge
