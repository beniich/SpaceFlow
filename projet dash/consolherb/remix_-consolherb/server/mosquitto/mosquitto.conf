# Mosquitto MQTT Broker — AgroMaître configuration
# Place this file at server/mosquitto/mosquitto.conf
# Start with Docker: see docker-compose.prod.yml

# ─── Network ────────────────────────────────────────────────────────────────
listener 1883
# Uncomment to enable WebSockets on port 9001 (for browser MQTT clients)
# listener 9001
# protocol websockets

# ─── Security ───────────────────────────────────────────────────────────────
# Allow anonymous access (change to false in production and add password_file)
allow_anonymous true

# ─── Persistence ────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ─── Connection limits ──────────────────────────────────────────────────────
max_connections 500
max_keepalive 60
