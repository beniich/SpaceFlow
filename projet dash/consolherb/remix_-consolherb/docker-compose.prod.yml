# ─── AgroMaître — Production Docker Compose ──────────────────────────────────
# Usage:
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Services:
#   traefik   → Reverse proxy + auto SSL (Let's Encrypt)
#   db        → PostgreSQL 16
#   backend   → Express API + Prisma
#   frontend  → React SPA served by Nginx

version: "3.9"

networks:
  agromaitre-net:
    driver: bridge

volumes:
  db-data:
  mosquitto-data:
  mosquitto-log:
  traefik-certs:

services:

  # ── Traefik reverse proxy ───────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: agromaitre-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all HTTP → HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - agromaitre-net

  # ── PostgreSQL database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: agromaitre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agromaitre
      POSTGRES_USER: ${POSTGRES_USER:-agromaitre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agromaitre}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agromaitre-net

  # ── Mosquitto MQTT broker ───────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agromaitre-mosquitto
    restart: unless-stopped
    volumes:
      - ./server/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"    # MQTT
    networks:
      - agromaitre-net

  # ── Express backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/agromaitre-backend:${IMAGE_TAG:-latest}
    container_name: agromaitre-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agromaitre}:${POSTGRES_PASSWORD}@db:5432/agromaitre
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: https://${DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=4000
    networks:
      - agromaitre-net

  # ── React frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/agromaitre-frontend:${IMAGE_TAG:-latest}
    container_name: agromaitre-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - agromaitre-net
