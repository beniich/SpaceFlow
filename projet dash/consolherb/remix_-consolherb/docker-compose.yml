version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agromaitre_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agromaitre
    ports:
      - "5433:5432"   # 5432 is already in use by auditax-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agromaitre"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agromaitre_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/agromaitre
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agromaitre_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
