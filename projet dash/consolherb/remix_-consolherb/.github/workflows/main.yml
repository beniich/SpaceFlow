name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:coverage

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Backend
        working-directory: ./server
        run: npm run build

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Build Backend Image
        run: docker build -t agromaitre-backend ./server

      - name: Build Frontend Image
        run: docker build -t agromaitre-frontend .
