version: '3.8'

# Override pour l'environnement Staging
services:
  postgres:
    container_name: beecarbonat-staging-postgres
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:-beecarbonat_staging}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_secure_pwd_99}
      POSTGRES_DB: ${STAGING_DB_NAME:-beecarbonat_staging}
    ports:
      - "5433:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data

  redis:
    container_name: beecarbonat-staging-redis
    ports:
      - "6380:6379"
    volumes:
      - staging_redis_data:/data

  backend:
    container_name: beecarbonat-staging-backend
    environment:
      - NODE_ENV=staging
      - PORT=5001
      - DATABASE_URL=postgresql://${STAGING_DB_USER:-beecarbonat_staging}:${STAGING_DB_PASSWORD:-staging_secure_pwd_99}@postgres:5432/${STAGING_DB_NAME:-beecarbonat_staging}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pwd}@redis:6379
      - JWT_SECRET=${STAGING_JWT_SECRET:-staging-jwt-secret-key-32-chars-min}
    ports:
      - "5001:5001"

volumes:
  staging_postgres_data:
  staging_redis_data:
